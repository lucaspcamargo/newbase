<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{{ TITLE }}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas#canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #111;
      z-index: 10;
      transition: opacity 0.35s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading-status {
      color: #888;
      font-family: monospace;
      font-size: 13px;
    }
    #progress-track {
      width: min(60vw, 360px);
      height: 4px;
      background: #2a2a2a;
      border-radius: 2px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: #ccc;
      border-radius: 2px;
      transition: width 0.15s ease;
    }
    @keyframes nb-progress-pulse {
      0%   { margin-left: 0%;   width: 20%; }
      50%  { margin-left: 40%;  width: 40%; }
      100% { margin-left: 80%;  width: 20%; }
    }
    #progress-fill.indeterminate {
      width: auto !important;
      animation: nb-progress-pulse 1.4s ease-in-out infinite;
    }
    #fullscreen-btn {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      color: #ccc;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.2s, background 0.15s;
    }
    body:hover #fullscreen-btn,
    #fullscreen-btn:focus-visible {
      opacity: 1;
    }
    #fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

  <div id="loading-overlay">
    <div id="loading-status">Loading&hellip;</div>
    <div id="progress-track">
      <div id="progress-fill"></div>
    </div>
  </div>

  <button id="fullscreen-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
    &#x26F6;
  </button>

  <script>
    (function () {
      var overlay  = document.getElementById('loading-overlay');
      var statusEl = document.getElementById('loading-status');
      var fillEl   = document.getElementById('progress-fill');
      var fsBtn    = document.getElementById('fullscreen-btn');

      fsBtn.addEventListener('click', function () {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });

      document.addEventListener('fullscreenchange', function () {
        fsBtn.textContent = document.fullscreenElement ? '\u22BF' : '\u26F6';
      });

      function hideOverlay() {
        overlay.classList.add('hidden');
        document.getElementById('canvas').focus();
      }

      // start indeterminate animation immediately — for now, files are embedded so
      // there is no separate download; setStatus will not provide (n/total) numbers.
      fillEl.classList.add('indeterminate');

      window.Module = {
        canvas: document.getElementById('canvas'),

        preRun: [function () {
          try { FS.mkdir('/libsdl'); } catch (e) {}
          FS.mount(IDBFS, {}, '/libsdl');
          addRunDependency('idbfs-sync');
          FS.syncfs(true, function (err) {
            if (err) console.warn('[nb] IDBFS load error:', err);
            removeRunDependency('idbfs-sync');
          });
        }],

        setStatus: function (text) {
          if (!text) { hideOverlay(); return; }
          var m = text.match(/([^(]+)\((\d+(?:\.\d+)?)\/(\d+)\)/);
          if (m) {
            // deterministic progress available (e.g. preloaded files)
            fillEl.classList.remove('indeterminate');
            fillEl.style.width = (parseFloat(m[2]) / parseFloat(m[3]) * 100) + '%';
            statusEl.textContent = m[1].trim();
          } else {
            statusEl.textContent = text;
          }
        },

        monitorRunDependencies: function (left) {
          if (left === 0) { hideOverlay(); }
        },

        onRuntimeInitialized: function () {
          hideOverlay();
        }
      };

      window.onerror = function (msg) {
        statusEl.textContent = 'Error: ' + msg;
        fillEl.style.background = '#c44';
      };
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
