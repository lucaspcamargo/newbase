- name: stage
  comps:
    script:
      lua: "res/asteroids/stage.lua"
- name: background
  comps:
    spatial:
      pos: [0, 0, 100]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    sprite:
      res: "res/asteroids/background.jpg"
- name: ship
  comps:
    spatial:
      pos: [0, 0, 0]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    sprite:
      res: "res/asteroids/spr/ship.png"
    script:
      lua: "res/asteroids/ship.lua"
    body2d:
      type: KINEMATIC
      shapes:
       - type: POLY
         data: [10, 10, 10, -10, -10, -10]
