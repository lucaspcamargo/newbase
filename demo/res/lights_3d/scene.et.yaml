- name: light_point_r
  comps:
    light:
      type: 1
      color: [1.0, 0.0, 0.0]
      range: 10
      intensity: 2.0
    spatial:
      pos: [0, 2, 2.89]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    mesh:
      mesh: "res/lights_3d/light_r.glb?msh=0"

- name: light_point_g
  comps:
    light:
      type: 1
      color: [0.0, 1.0, 0.0]
      range: 10
      intensity: 2.0
    spatial:
      pos: [-2.5, 2, -1.44]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    mesh:
      mesh: "res/lights_3d/light_g.glb?msh=0"

- name: light_point_b
  comps:
    light:
      type: 1
      color: [0.0, 0.0, 1.0]
      range: 10
      intensity: 2.0
    spatial:
      pos: [2.5, 2, -1.44]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    mesh:
      mesh: "res/lights_3d/light_b.glb?msh=0"

- name: light_spot
  comps:
    light:
      type: 2
      color: [1.0, 1.0, 1.0]
      range: 30
      intensity: 3.0
      casts_shadows: true
    spatial:
      pos: [0, 6, 0]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
