- name: scene
  comps:
    script:
      lua: "res/lights_3d/scene.lua"

- name: environment
  comps:
    environment:
        ambient: [0.0, 0.0, 0.0] # tested, but black is better for this demo

- name: camera
  comps:
    spatial:
      pos: [0, 2, 4]
      rot: [-20, 0, 0]
      scale: [1.0, 1.0, 1.0]
    camera:
      3d:
        clip_near: 0.1
        clip_far: 30.0

- name: base
  comps:
    mesh:
      mesh: "res/lights_3d/base.glb?msh=0"
    spatial:
      pos: [0, 0, 0]
      rot: [0, 0, 0]
      scale: [1, 1, 1]

- name: mesh
  comps:
    mesh:
      mesh: "res/lights_3d/suzanne_marble.glb?msh=0"
    spatial:
      pos: [0, 1, 0]
      rot: [0, 0, 0]
      scale: [1, 1, 1]

