- name: scene
  comps:
    script:
      lua: "res/platformer/scene.lua"
- name: camera
  comps:
    spatial:
      pos: [0, 0, 0]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    camera:
      2d:
        fit_mode: 1
        fit_dims: [1920, 1080]
- name: tilemap_bg
  comps:
    spatial:
      pos: [0, 0, 1]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    tilemap:
      res: "res/platformer/map/map_0.tmj"
      render_layer: "bg"
- name: tilemap_fg
  comps:
    spatial:
      pos: [0, 0, -1]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    tilemap:
      res: "res/platformer/map/map_0.tmj"
      render_layer: "fg"
      collision_layer: "fg"
