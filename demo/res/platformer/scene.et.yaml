- name: scene
  comps:
    script:
      lua: "res/platformer/scene.lua"

- name: tilemap_bg
  comps:
    spatial:
      pos: [0, 0, 1]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    tilemap:
      res: "res/platformer/map/map_0.tmj"
      render_layer: "bg"

- name: tilemap_fg
  comps:
    spatial:
      pos: [0, 0, 0]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    tilemap:
      res: "res/platformer/map/map_0.tmj"
      render_layer: "fg"
      collision_layer: "fg"

- name: box0
  comps:
    spatial:
      pos: [350, 100, 0]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    sprite:
      res: res/physics2d_demo/square.sprite
    body2d:
      type: DYNAMIC
      gravity_scale: 1.0
      enable_sleep: false
      shapes:
        - type: BOX
          data: [30, 30]
          restitution: 0.3
          friction: 0.4

- name: box1
  comps:
    spatial:
      pos: [560, 100, 0]
      rot: [0, 0, 15]
      scale: [1, 1, 1]
    sprite:
      res: res/physics2d_demo/square.sprite
    body2d:
      type: DYNAMIC
      gravity_scale: 1.0
      enable_sleep: false
      shapes:
        - type: BOX
          data: [30, 30]
          restitution: 0.3
          friction: 0.4

- name: ball0
  comps:
    spatial:
      pos: [700, 100, 0]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    sprite:
      res: res/physics2d_demo/circle.sprite
    body2d:
      type: DYNAMIC
      gravity_scale: 1.0
      enable_sleep: false
      shapes:
        - type: CIRCLE
          data: [25]
          restitution: 0.4
          friction: 0.3
