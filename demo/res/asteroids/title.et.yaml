- name: title
  comps:
    script:
      lua: "res/asteroids/title.lua"
- name: title_sprite
  comps:
    spatial:
      pos: [0, 0, 0]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    sprite:
      res: "res/asteroids/spr/title.sprite"
- name: camera
  comps:
    spatial:
      pos: [0, 0, 0]
      rot: [0, 0, 0]
      scale: [1, 1, 1]
    camera:
      2d:
        fit_mode: 2
        fit_dims: [1920, 400]
