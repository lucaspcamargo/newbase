id: br.eng.camargo.newbase.demo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: newbase_demo
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # GPU acceleration if needed
  - --device=dri
  # Needs to talk to the network:
  - --share=network
  # Needs to save files locally
  - --filesystem=xdg-documents
  # Pipewire
  - --filesystem=xdg-run/pipewire-0:ro
modules:
  - name: newbase_demo
    buildsystem: cmake-ninja
    config-opts: ["-DNEWBASE_LUA_ROOT=lua", "-DNEWBASE_FDO_FILES=ON", "-DNEWBASE_USE_XDG_DATA_DIRS=ON", "-DNEWBASE_LTO=ON"]
    sources:
      - type: git
        url: ../..
        branch: main
        dest: .
      - type: archive
        url: https://www.lua.org/ftp/lua-5.5.0.tar.gz
        sha256: 57ccc32bbbd005cab75bcc52444052535af691789dba2b9016d5c50640d68b3d
        dest: lua
    modules:
    - python-build-deps.json

# NOTE: before flatpak build, update above module with:
# ./scripts/flatpak-pip-generator.py --requirements-file ./scripts/requirements.txt -o ./demo/flatpak/python-build-deps

