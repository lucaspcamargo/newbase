# example from https://gitea.com/action-examples/Android/src/branch/main/.gitea/workflows/test.yaml

name: testing
on:
  - push
  - pull_request

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build Demo App
        run: cd demo/android-project && ./gradlew --no-daemon build