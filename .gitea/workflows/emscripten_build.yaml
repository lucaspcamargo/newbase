name: Emscripten build
run-name: ${{ gitea.actor }} is building newbase emscripten
on: [push]

jobs:
  Main-Build:
    runs-on: ubuntu-latest
    steps:
      - uses: mymindstorm/setup-emsdk@v14
      - name: Verify Emscripten installation
        run: emcc -v
      - name: "Setup and activate python venv"
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          env
          echo PATH=$PATH >> $GITHUB_ENV
      - run: which pip && which python
      - name: Install Latest CMake
        run: pip install cmake~=3.5
      - name: Verify CMake installation
        run: cmake --version
      - run: env
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt
      - run: git submodule update --init --recursive
      - run: cmake -S . -B embuild -DCMAKE_TOOLCHAIN_FILE=${EMSDK}/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake
      - run: cmake --build embuild -j $(( $(nproc) - 1 ))
