name: Flatpak Build
run-name: ${{ gitea.actor }} is building newbase for Flatpack 🐧
on: [push]

jobs:
  Main-Build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Gather info
        run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        name: "Build"
        with:
          bundle: newbase_demo_${SHORT_SHA}.flatpak
          manifest-path: demo/flatpak/br.eng.camargo.newbase.demo.yml
          cache-key: flatpak-builder-${SHORT_SHA}
